version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: graphrag_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: graphrag
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.12-community
    container_name: graphrag_neo4j
    ports:
      - "7474:7474" # Web Console HTTP
      - "7687:7687" # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password
    stop_grace_period: 30s
    entrypoint: ["tini", "-g", "--", "bash", "-c", "rm -f /var/lib/neo4j/run/neo4j.pid /data/dbms/neo4j.pid && exec /startup/docker-entrypoint.sh neo4j"]
    volumes:
      - neo4jdata:/data

  backend:
    build: ./backend
    container_name: graphrag_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      - postgres
      - neo4j
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build: ./frontend
    container_name: graphrag_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  neo4jdata:

